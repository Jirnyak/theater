<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jirnyak / Theater</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --crimson: #800000;
            --crimson-light: #b30000;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --dark: #0a0a0a;
            --velvet: #2b0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark);
            color: #fff;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Cinematic Spotlight Background */
        .stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 0%, var(--velvet) 0%, var(--dark) 70%);
            overflow: hidden;
        }

        .spotlight {
            position: absolute;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 120vh;
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: breathe 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {
            0% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            100% { opacity: 0.8; transform: translateX(-50%) scale(1.05); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(43, 0, 0, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 4rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.05);
            animation: float 6s ease-in-out infinite;
            max-width: 800px;
            width: 100%;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            color: var(--gold);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.8rem;
            color: var(--gold-light);
            margin-bottom: 2rem;
            font-weight: 400;
            font-style: italic;
            opacity: 0.9;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #ddd;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Theatrical Button */
        .btn-curtain {
            display: inline-block;
            padding: 1.2rem 3rem;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            text-decoration: none;
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            border: 1px solid var(--gold-light);
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.3);
            cursor: pointer;
        }

        .btn-curtain::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.6s ease;
        }

        .btn-curtain:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0,0,0,0.6), 0 0 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
        }

        .btn-curtain:hover::before {
            left: 100%;
        }

        /* Curtain Animation Effect */
        .curtain-left, .curtain-right {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            background: linear-gradient(to right, var(--crimson) 0%, var(--velvet) 100%);
            z-index: 10;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            border-right: 5px solid var(--gold);
            transition: transform 2s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }

        .curtain-right {
            right: 0;
            background: linear-gradient(to left, var(--crimson) 0%, var(--velvet) 100%);
            border-left: 5px solid var(--gold);
            border-right: none;
        }

        body.loaded .curtain-left {
            transform: translateX(-100%);
        }

        body.loaded .curtain-right {
            transform: translateX(100%);
        }

        /* Gold Dust Particles */
        .particle {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1); }
        }

    </style>
</head>
<body>
    <div class="curtain-left"></div>
    <div class="curtain-right"></div>

    <div class="stage">
        <div class="spotlight"></div>
        <div id="particles"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <h1>Theater</h1>
            <h2>By Jirnyak</h2>
            <p>Welcome to the grand stage. A repository dedicated to the dramatic arts of code, weaving tales of elegance and cinematic flair. The curtains have risen.</p>
            <a href="https://github.com/Jirnyak/theater" class="btn-curtain">Take a Bow</a>
        </div>
    </div>

    <script>
        // Trigger curtain opening
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 500);

            // Generate gold dust particles
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize properties
                const size = Math.random() * 4 + 1;
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 3;
                const delay = Math.random() * 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.top = `${top}vh`;
                particle.style.left = `${left}vw`;
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.setProperty('--delay', `${delay}s`);
                
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
